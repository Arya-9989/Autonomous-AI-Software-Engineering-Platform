name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install Python 3.12 and locked dependencies
        run: uv sync --locked --python 3.12
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright + axe, landing and app)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install Python 3.12 and locked dependencies
        run: uv sync --locked --python 3.12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build the UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright (FastAPI + worker + offline provider, axe on every page)
        working-directory: frontend
        run: npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  infrastructure:
    name: Infrastructure (Terraform, Kubernetes, generated project)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Platform Terraform (fmt + validate)
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Platform Kubernetes manifests (kubeconform)
        run: kubectl kustomize deploy/k8s | kubeconform -strict -summary -
      - name: Generate a sample project with the offline pipeline
        run: |
          uv sync --locked --python 3.12
          uv run autoswe generate "A REST API for a small library where members borrow books and librarians track loans with due dates." \
            --provider offline --out "$RUNNER_TEMP/sample"
      - name: Generated Terraform validates
        working-directory: ${{ runner.temp }}/sample/deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Generated Kubernetes manifests validate
        run: kubectl kustomize "$RUNNER_TEMP/sample/deploy/k8s" | kubeconform -strict -summary -
      - name: Generated project passes its own lint and tests
        working-directory: ${{ runner.temp }}/sample
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e . pytest httpx2 ruff
          .venv/bin/ruff check .
          .venv/bin/pytest -q

  sandbox:
    name: Sandbox (real containers, escape tests) and eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install Python 3.12 and locked dependencies
        run: uv sync --locked --python 3.12
      - name: Build the sandbox image
        run: docker build -f sandbox/Dockerfile -t autoswe-sandbox:local .
      - name: Sandbox tests against real containers (limits and escape attempts)
        env:
          AUTOSWE_REQUIRE_DOCKER: "1"
        run: uv run pytest -q -m docker tests/test_sandbox_docker.py
      - name: Eval suite (recorded responses, Docker sandbox, checked-in thresholds)
        run: uv run autoswe eval run --sandbox docker --out eval-report
      - name: Eval report in the job summary
        if: always()
        run: cat eval-report/eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Eval report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: eval-report
          retention-days: 30

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: autoswe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name autoswe -p 8000:8000 -e AUTH_DISABLED=true autoswe:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/readyz
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
          test "$(docker inspect --format '{{.Config.User}}' autoswe:ci)" = "10001"
      - name: Container logs
        if: always()
        run: docker logs autoswe || true
