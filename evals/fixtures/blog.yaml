name: blog
description: Text, boolean and optional datetime fields across two entities.
spec: >-
  A blogging backend. Entities: Post(title, body:text, published:bool,
  published_at?:datetime), Comment(author, body:text, approved:bool)
expected:
  entities: [Post, Comment]
  fields:
    Post: [title, body, published, published_at]
    Comment: [author, body, approved]
  endpoints:
    - GET /posts
    - POST /posts
    - DELETE /posts/{post_id}
    - GET /comments
    - POST /comments
    - PATCH /comments/{comment_id}
  min_tests: 10
