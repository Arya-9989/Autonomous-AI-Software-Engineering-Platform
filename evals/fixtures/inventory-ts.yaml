name: inventory-ts
stack: typescript
description: 'The inventory fixture on TypeScript on Node.js 24: explicit typed field syntax, including
  optional fields and dates.'
spec: 'Inventory service. Entities: Product(name, price:float, stock:int, active:bool), Shipment(carrier,
  shipped_at:datetime, delivered_on?:date, notes?)'
expected:
  entities:
  - Product
  - Shipment
  fields:
    Product:
    - name
    - price
    - stock
    - active
    Shipment:
    - carrier
    - shipped_at
    - delivered_on
    - notes
  endpoints:
  - GET /products
  - POST /products
  - PATCH /products/{product_id}
  - DELETE /products/{product_id}
  - GET /shipments/{shipment_id}
  - POST /shipments
  min_tests: 10
