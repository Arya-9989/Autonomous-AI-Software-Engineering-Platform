# Used by the alembic CLI during development, e.g.
#   DATABASE_URL=sqlite+aiosqlite:///./data/autoswe.db uv run alembic revision --autogenerate -m "..."
# At runtime the app calls autoswe.migrations.runner directly.
[alembic]
script_location = autoswe:migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
