# Model prices in USD per million tokens, used to compute the cost of every model call.
# Override the whole table with PRICING_FILE=/path/to/pricing.toml (same format).
#
# Source: the Anthropic model table in Anthropic's claude-api skill (prices cached 2026-10-06)
# and its prompt-caching reference: a cache write costs 1.25x the base input price with the
# 5-minute TTL (the only TTL AutoSWE requests), a cache read 0.1x, except Claude Opus 5.5
# ($0.20), Claude Sonnet 5.5 ($0.20), Claude Fable 5 ($1.00) and Claude Fable 5.1 ($0.25),
# which the reference lists explicitly. These are first-party Claude API rates; Amazon Bedrock
# and Vertex AI price separately. Check https://www.anthropic.com/pricing before relying on a
# number for billing.
#
# Not listed (calls are counted as unpriced rather than guessed): Claude Haiku 5.5, whose
# price depends on prompt length, and any model not below.

