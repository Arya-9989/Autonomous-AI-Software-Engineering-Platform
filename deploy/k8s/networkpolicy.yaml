# Ingress only on the HTTP port; egress to DNS, PostgreSQL and HTTPS (Anthropic API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autoswe
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: autoswe
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
