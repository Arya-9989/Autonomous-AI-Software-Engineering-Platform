# The queue workers: `autoswe worker` claims jobs from the database queue and runs the agent
# pipeline. It serves only /healthz, /readyz and /metrics (no API, no UI, no Service). The
# replica count is owned by the KEDA ScaledObject in worker-scaledobject.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoswe-worker
  labels:
    app.kubernetes.io/name: autoswe-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: autoswe-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoswe-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: autoswe
      automountServiceAccountToken: false
      # On SIGTERM a worker stops claiming, lets running jobs finish for WORKER_DRAIN_S, then
      # requeues the rest for another worker. The grace period covers the drain plus requeue.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: autoswe-worker
      initContainers:
        - name: migrate
          image: autoswe
          command: ["autoswe", "migrate"]  # advisory-locked: safe beside the API's
          envFrom:
            - configMapRef:
                name: autoswe
            - secretRef:
                name: autoswe
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: autoswe
          command: ["autoswe", "worker"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: WORKER_DRAIN_S
              value: "40"
          envFrom:
            - configMapRef:
                name: autoswe
            - secretRef:
                name: autoswe
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
