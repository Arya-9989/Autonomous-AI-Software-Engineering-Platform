# Local stack: the platform (API + UI + worker) backed by PostgreSQL, plus the sandbox runner that
# executes generated test suites.
#   docker compose up --build        -> http://localhost:8000
# Values here are for local use only; production config lives in deploy/.
name: autoswe

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autoswe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoswe-local}
      POSTGRES_DB: autoswe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoswe -d autoswe"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: autoswe:local
    depends_on:
      db:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    ports:
      - "${AUTOSWE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://autoswe:${POSTGRES_PASSWORD:-autoswe-local}@db:5432/autoswe
      LOG_FORMAT: json
      WORKER_CONCURRENCY: "2"
      # Local demo defaults: no auth, offline provider unless a key is supplied.
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      API_KEYS: ${API_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Generated tests run in the sandbox runner; this container has no Docker access.
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-remote}
      SANDBOX_RUNNER_URL: http://sandbox-runner:8080
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-local-demo-runner-token-change-me}
      # Tracing is off unless an OTLP endpoint is set; with `--profile tracing`, use
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 (UI on http://localhost:16686).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: autoswe
    networks: [default, sandbox]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The only service with Docker access (the socket is root-equivalent on the host). It is
  # reachable only from `app`, over an internal network with no route out, and it starts
  # sandbox containers with limits it alone decides. See docs/adr/0001.
  sandbox-runner:
    build:
      context: .
      target: sandbox-runner
    image: autoswe-sandbox-runner:local
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      sandbox-image-node:
        condition: service_completed_successfully
      sandbox-image-go:
        condition: service_completed_successfully
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-local-demo-runner-token-change-me}
      SANDBOX_IMAGE: autoswe-sandbox:local
      SANDBOX_IMAGE_TYPESCRIPT: autoswe-sandbox-node:local
      SANDBOX_IMAGE_GO: autoswe-sandbox-go:local
      SANDBOX_POOL: compose
      # Set to runsc to run every sandbox container under gVisor (if the daemon has it).
      SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-}
      DOCKER_CONFIG: /tmp/.docker
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: autoswe-sandbox-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket's group: 0 on Docker Desktop; `stat -c %g /var/run/docker.sock` on Linux.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Build the images sandbox containers start from (one per target stack), then exit.
  sandbox-image:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: autoswe-sandbox:local
    command: ["python", "-c", "pass"]
    network_mode: none
    read_only: true
    restart: "no"

  sandbox-image-node:
    build:
      context: .
      dockerfile: sandbox/node/Dockerfile
    image: autoswe-sandbox-node:local
    command: ["python", "-c", "pass"]
    network_mode: none
    read_only: true
    restart: "no"

  sandbox-image-go:
    build:
      context: .
      dockerfile: sandbox/go/Dockerfile
    image: autoswe-sandbox-go:local
    command: ["python", "-c", "pass"]
    network_mode: none
    read_only: true
    restart: "no"

  # Optional trace viewer. Start with:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile tracing up --build
  jaeger:
    image: jaegertracing/jaeger:2.12.0@sha256:4c8423cd8fa8b727bd632f0acda2cc39118f21a4bdcef322a6c9ddbeb6dcd424
    profiles: [tracing]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks: [default, sandbox]
    restart: unless-stopped

networks:
  sandbox:
    internal: true

volumes:
  pgdata:
