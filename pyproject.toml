[project]
name = "autoswe"
version = "0.1.0"
description = "Multi-agent pipeline that turns a natural-language spec into a reviewed, containerised project with CI, Kubernetes manifests and Terraform."
readme = "README.md"
license = "MIT"
authors = [{ name = "Arya Mahindrakar" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "aiosqlite>=0.21",
    "anthropic>=1.0,<2",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "prometheus-client>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-hcl2>=7.0",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
autoswe = "autoswe.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoswe"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT", "RET", "PL", "C4", "DTZ", "T20",
]
ignore = [
    "PLR0913",  # agents and factories legitimately take several collaborators
    "PLR2004",  # magic values are fine in tests and HTTP status checks
    "S101",     # assert is used for type narrowing and in tests
    "PLR0917",  # FastAPI endpoints take their dependencies as parameters
    "SIM905",   # word lists read better as a split() string
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "PLC0415", "PT018"]
"src/autoswe/migrations/**" = ["E501"]
# The offline engine renders source code; long template lines are intentional.
"src/autoswe/llm/offline/templates*.py" = ["E501", "S608"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/autoswe", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["hcl2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["slow: runs the generated project's own test-suite in a subprocess"]
filterwarnings = ["error::DeprecationWarning:autoswe.*"]
